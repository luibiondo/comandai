services:
  db:
    image: postgres:17
    container_name: comandai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: comandai
      POSTGRES_PASSWORD: comandai
      POSTGRES_DB: comandai
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comandai -d comandai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
